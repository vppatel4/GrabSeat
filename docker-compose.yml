# One command brings up the whole system: Redis, Postgres, the Go backend
# (scalable), an nginx gateway that load-balances across backend instances,
# and the Next.js frontend.
#
#   docker compose up -d --build
#
# To prove the pub/sub design is genuinely cross-instance, scale the backend:
#   docker compose up -d --build --scale backend=2
#
# The gateway re-resolves the "backend" service name on every request, so new
# replicas are picked up automatically and WebSocket upgrades are round-robined.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # notify-keyspace-events Ex turns on "expired" key events. That is how an
    # abandoned hold, once its TTL fires, tells the backend to broadcast "freed"
    # to every client — no polling and no separate cleanup job.
    command: ["redis-server", "--notify-keyspace-events", "Ex", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_ADDR: ${REDIS_ADDR}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      BACKEND_PORT: "8080"
      HOLD_TTL_SECONDS: ${HOLD_TTL_SECONDS}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN}
      OTEL_TRACES_EXPORTER: ${OTEL_TRACES_EXPORTER}
      LOG_LEVEL: ${LOG_LEVEL}
    # No host port here on purpose: the gateway is the single front door, which
    # is what lets us run several backend replicas at once.
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  gateway:
    image: nginx:1.27-alpine
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      - backend
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - gateway
    restart: unless-stopped

volumes:
  pgdata:
