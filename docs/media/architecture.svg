<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" font-family="Helvetica, Arial, sans-serif" font-size="12.5">
  <defs>
    <marker id="triDark" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4d4d4d"/>
    </marker>
    <marker id="triDarkStart" markerWidth="12" markerHeight="12" refX="1" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M10,0 L0,5 L10,10 z" fill="#4d4d4d"/>
    </marker>
    <marker id="triBlue" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6c8ebf"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="959" height="299" fill="#ffffff" stroke="#ffffff"/>

  <!-- edges -->
  <g stroke="#4d4d4d" stroke-width="1.4" fill="none">
    <line x1="170" y1="162" x2="290" y2="162" marker-end="url(#triDark)" marker-start="url(#triDarkStart)"/>
    <line x1="420" y1="162" x2="540" y2="162" marker-end="url(#triDark)" marker-start="url(#triDarkStart)"/>
    <line x1="680" y1="150" x2="800" y2="74" marker-end="url(#triDark)"/>
    <line x1="680" y1="176" x2="800" y2="250" marker-end="url(#triDark)"/>
  </g>
  <line x1="800" y1="92" x2="682" y2="166" stroke="#6c8ebf" stroke-width="1.4" fill="none" stroke-dasharray="6 4" marker-end="url(#triBlue)"/>

  <!-- edge labels (white gap behind text, like draw.io) -->
  <g text-anchor="middle" fill="#333333">
    <g><rect x="198" y="154" width="64" height="16" fill="#ffffff"/><text x="230" y="166">WebSocket</text></g>
    <g><rect x="441" y="154" width="78" height="16" fill="#ffffff"/><text x="480" y="166">hold / confirm</text></g>
    <g><rect x="707" y="95" width="56" height="16" fill="#ffffff"/><text x="735" y="107">hold seat</text></g>
    <g><rect x="711" y="134" width="74" height="16" fill="#ffffff"/><text x="748" y="146" fill="#2563eb">seat updates</text></g>
    <g><rect x="698" y="208" width="74" height="16" fill="#ffffff"/><text x="735" y="220">save booking</text></g>
  </g>

  <!-- rectangle nodes -->
  <g stroke-width="1.5">
    <rect x="40"  y="130" width="130" height="64" rx="6" fill="#dae8fc" stroke="#6c8ebf"/>
    <rect x="290" y="130" width="130" height="64" rx="6" fill="#ffe6cc" stroke="#d79b00"/>
    <rect x="540" y="130" width="140" height="64" rx="6" fill="#dae8fc" stroke="#6c8ebf"/>
  </g>
  <g text-anchor="middle" fill="#000000">
    <text x="105" y="158">Browser tabs</text>
    <text x="105" y="174" fill="#555555">(users)</text>
    <text x="355" y="166">nginx gateway</text>
    <text x="610" y="166">Go backend</text>
  </g>

  <!-- Redis cylinder -->
  <g stroke="#b85450" stroke-width="1.5">
    <path d="M800,55 L800,100 A65,11 0 0 0 930,100 L930,55 Z" fill="#f8cecc"/>
    <ellipse cx="865" cy="55" rx="65" ry="11" fill="#f8cecc"/>
  </g>
  <g text-anchor="middle" fill="#000000">
    <text x="865" y="82">Redis</text>
    <text x="865" y="98" fill="#555555">seat holds</text>
  </g>

  <!-- Postgres cylinder -->
  <g stroke="#82b366" stroke-width="1.5">
    <path d="M800,232 L800,277 A65,11 0 0 0 930,277 L930,232 Z" fill="#d5e8d4"/>
    <ellipse cx="865" cy="232" rx="65" ry="11" fill="#d5e8d4"/>
  </g>
  <g text-anchor="middle" fill="#000000">
    <text x="865" y="259">PostgreSQL</text>
    <text x="865" y="275" fill="#555555">bookings</text>
  </g>
</svg>
