<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 320" font-family="Segoe UI, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 Z" fill="#475569"/>
    </marker>
    <marker id="arrowStart" markerWidth="9" markerHeight="9" refX="1" refY="3.5" orient="auto">
      <path d="M8,0 L0,3.5 L8,7 Z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="938" height="318" rx="10" fill="#ffffff" stroke="#e2e8f0"/>

  <!-- boxes -->
  <g stroke="#94a3b8" stroke-width="1.5">
    <rect x="30"  y="120" width="150" height="64" rx="8" fill="#eef2f7"/>
    <rect x="260" y="120" width="150" height="64" rx="8" fill="#eef2f7"/>
    <rect x="490" y="120" width="160" height="64" rx="8" fill="#eef2f7"/>
    <rect x="740" y="40"  width="170" height="60" rx="8" fill="#fdecec"/>
    <rect x="740" y="205" width="170" height="60" rx="8" fill="#e9f1fb"/>
  </g>

  <!-- labels -->
  <g fill="#1f2937" text-anchor="middle">
    <text x="105" y="147">Browser tabs</text>
    <text x="105" y="166" fill="#64748b" font-size="12">(one per user)</text>
    <text x="335" y="156">nginx gateway</text>
    <text x="570" y="147">Go backend</text>
    <text x="570" y="166" fill="#64748b" font-size="12">(1 or more)</text>
    <text x="825" y="66">Redis</text>
    <text x="825" y="85" fill="#64748b" font-size="12">holds + pub/sub</text>
    <text x="825" y="231">Postgres</text>
    <text x="825" y="250" fill="#64748b" font-size="12">bookings</text>
  </g>

  <!-- arrows -->
  <g stroke="#475569" stroke-width="1.6" fill="none">
    <!-- browser <-> gateway -->
    <line x1="180" y1="152" x2="260" y2="152" marker-end="url(#arrow)" marker-start="url(#arrowStart)"/>
    <!-- gateway <-> backend -->
    <line x1="410" y1="152" x2="490" y2="152" marker-end="url(#arrow)" marker-start="url(#arrowStart)"/>
    <!-- backend -> redis -->
    <line x1="650" y1="140" x2="740" y2="80" marker-end="url(#arrow)"/>
    <!-- redis -> backend (pub/sub back) -->
    <line x1="740" y1="95" x2="650" y2="150" marker-end="url(#arrow)" stroke-dasharray="5 4"/>
    <!-- backend -> postgres -->
    <line x1="650" y1="164" x2="740" y2="225" marker-end="url(#arrow)"/>
  </g>

  <!-- arrow labels -->
  <g fill="#64748b" font-size="12" text-anchor="middle">
    <text x="220" y="143">WebSocket</text>
    <text x="450" y="143">hold / confirm</text>
    <text x="676" y="95">SET NX EX</text>
    <text x="690" y="135" fill="#2563eb">pub/sub</text>
    <text x="712" y="205">booking</text>
  </g>

  <text x="470" y="298" text-anchor="middle" fill="#475569" font-size="12.5">
    Seat changes go out over Redis pub/sub, so a booking on one backend reaches browsers connected to any backend.
  </text>
</svg>
