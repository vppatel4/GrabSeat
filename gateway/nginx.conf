worker_processes 1;

events {
    worker_connections 1024;
}

http {
    # Docker's embedded DNS. Using a resolver + a variable upstream forces nginx
    # to re-resolve "backend" on each request instead of caching one replica at
    # startup. That is what makes `--scale backend=2` actually round-robin, and
    # it lets a WebSocket client and a booking request land on different
    # instances so cross-instance pub/sub gets exercised.
    resolver 127.0.0.11 valid=5s ipv6=off;

    # Map for WebSocket upgrade: pass Connection: upgrade only when asked.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 8080;

        location / {
            set $backend "backend:8080";
            proxy_pass http://$backend;

            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket upgrade passthrough.
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Long-lived WebSocket connections must not be closed by a read timeout.
            proxy_read_timeout  3600s;
            proxy_send_timeout  3600s;
        }
    }
}
